<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Favicon: o octógono da marca com o monograma ML.

    A logo cheia não serve aqui — ela é larga e o lettering some a 16px. O que
    sobrevive nesse tamanho é a silhueta octogonal em vermelho, que já é o
    elemento que identifica o jogo.
  -->
  <rect width="64" height="64" fill="#0b0b0d"/>
  <polygon
    points="21,5 43,5 59,21 59,43 43,59 21,59 5,43 5,21"
    fill="#c1121f"/>
  <polygon
    points="23.5,10 40.5,10 54,23.5 54,40.5 40.5,54 23.5,54 10,40.5 10,23.5"
    fill="#0b0b0d"/>
  <text
    x="32" y="41.5"
    text-anchor="middle"
    font-family="Rajdhani, Arial Narrow, sans-serif"
    font-size="24"
    font-weight="700"
    letter-spacing="-1"
    fill="#f5f5f5">ML</text>
</svg>
